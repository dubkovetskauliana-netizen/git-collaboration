<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Таблиця</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 30px; background-color: #f4f4f4;">

<h1>Завдання 1. Складна таблиця</h1>

<!-- Таблиця з товщиною рамки 2px, вирівняна по центру -->
<table border="2" cellspacing="0" cellpadding="0" style="margin: 0 auto; width: 400px; height: 400px; border-color: black; border-collapse: collapse;">

    <!-- Рядок 1 -->
    <tr>
        <td colspan="8" style="background-color: #33ffcc; height: 40px;"></td>
    </tr>

    <!-- Рядок 2 -->
    <tr>
        <td rowspan="6" style="background-color: #ffffcc; width: 40px;"></td>
        <td colspan="6" style="background-color: #33ffcc; height: 40px;"></td>
        <td rowspan="6" style="background-color: #ffffcc; width: 40px;"></td>
    </tr>

    <!-- Рядок 3 -->
    <tr>
        <td rowspan="4" style="background-color: #ffffff; width: 40px;"></td>
        <td colspan="4" style="background-color: #33ffcc; height: 40px;"></td>
        <td rowspan="4" style="background-color: #ffffff; width: 40px;"></td>
    </tr>

    <!-- Рядок 4 -->
    <tr>
        <td rowspan="2" style="background-color: #ffffcc; width: 40px;"></td>
        <!-- Центральні кольорові квадрати (верхній ряд) -->
        <td style="background-color: red; width: 40px; height: 40px;"></td>
        <td style="background-color: blue; width: 40px; height: 40px;"></td>
        <td rowspan="2" style="background-color: #ffffcc; width: 40px;"></td>
    </tr>

    <!-- Рядок 5 -->
    <tr>
        <!-- Центральні кольорові квадрати (нижній ряд) -->
        <td style="background-color: #33ff33; width: 40px; height: 40px;"></td>
        <td style="background-color: #ffff33; width: 40px; height: 40px;"></td>
    </tr>

    <!-- Рядок 6 -->
    <tr>
        <td colspan="4" style="background-color: #33ffcc; height: 40px;"></td>
    </tr>

    <!-- Рядок 7 -->
    <tr>
        <td colspan="6" style="background-color: #33ffcc; height: 40px;"></td>
    </tr>

    <!-- Рядок 8 -->
    <tr>
        <td colspan="8" style="background-color: #33ffcc; height: 40px;"></td>
    </tr>

</table>

<br><br>

</body>
</html>
