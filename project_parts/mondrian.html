<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Картина Піта Мондріана</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 30px; background-color: #f4f4f4;">

<h1>Завдання 2. Картина Піта Мондріана</h1>

<!-- Абсолютно стабільна та точна копія картини Мондріана -->
<table style="margin: 0 auto; width: 450px; height: 450px; background-color: #000000; border-spacing: 10px; border-collapse: separate;">

    <!-- Жорстка фіксація 4-х стовпців, щоб нічого не косило -->
    <colgroup>
        <col style="width: 15%;">
        <col style="width: 30%;">
        <col style="width: 30%;">
        <col style="width: 25%;">
    </colgroup>

    <!-- Рядок 1 -->
    <tr>
        <td rowspan="2" style="background-color: #ffffff;"></td> <!-- Лівий білий прямокутник -->
        <td colspan="2" rowspan="2" style="background-color: #ff5b2d;"></td> <!-- ВЕЛИКИЙ ЧЕРВОНИЙ КВАДРАТ -->
        <td style="background-color: #fffa69; height: 20%;"></td> <!-- Жовтий верхній -->
    </tr>

    <!-- Рядок 2 -->
    <tr>
        <td style="background-color: #ffffff; height: 20%;"></td> <!-- Білий під жовтим -->
    </tr>

    <!-- Рядок 3 -->
    <tr>
        <td style="background-color: #ffffff; height: 15%;"></td>
        <td colspan="2" style="background-color: #ffffff;"></td> <!-- Широка біла смуга під червоним -->
        <td style="background-color: #ffffff;"></td>
    </tr>

    <!-- Рядок 4 -->
    <tr>
        <td style="background-color: #ffffff; height: 25%;"></td>
        <td style="background-color: #000000;"></td> <!-- Чорний квадрат -->
        <td style="background-color: #ffffff;"></td>
        <td style="background-color: #074481;"></td> <!-- Синій квадрат -->
    </tr>

    <!-- Рядок 5 -->
    <tr>
        <td style="background-color: #fffa69; height: 20%;"></td> <!-- Жовтий нижній ліворуч -->
        <td colspan="2" style="background-color: #ffffff;"></td>
        <td style="background-color: #ffffff;"></td>
    </tr>

</table>

<p><a href="../index.html" style="font-size: 16px; color: #0066cc; text-decoration: none; font-weight: bold;">Повернутись на головну</a></p>

</body>
</html>
